<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>JobAI — Connexion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { background:linear-gradient(135deg,#0F172A 0%,#1E3A8A 100%); min-height:100vh;
      display:flex; align-items:center; justify-content:center; font-family:'Segoe UI',sans-serif; }
    .card { background:#fff; border-radius:20px; padding:40px; width:100%; max-width:420px;
      box-shadow:0 25px 60px rgba(0,0,0,.3); }
    .form-control { border-radius:10px; padding:11px 14px; border:1.5px solid #E2E8F0; }
    .form-control:focus { border-color:#4F46E5; box-shadow:0 0 0 3px rgba(79,70,229,.1); }
    .btn-primary { background:#4F46E5; border:none; border-radius:10px; padding:12px;
      font-weight:700; width:100%; }
    .btn-primary:hover { background:#4338CA; }
    .error { background:#FEE2E2; color:#991B1B; border-radius:8px; padding:10px 14px; font-size:.85rem; }
  </style>
</head>
<body>
<div class="card">
  <div class="text-center mb-4">
    <div style="font-size:2.5rem;">🤖</div>
    <h4 class="fw-bold mt-2">Connexion à JobAI</h4>
  </div>
  {% if error %}<div class="error mb-3">{{ error }}</div>{% endif %}
  {% with msgs = get_flashed_messages() %}{% if msgs %}
    <div class="alert alert-info mb-3">{{ msgs[0] }}</div>
  {% endif %}{% endwith %}
  <form method="POST">
    <div class="mb-3">
      <label class="form-label small fw-bold text-muted">Email</label>
      <input type="email" name="email" class="form-control" placeholder="jean@email.com" autofocus required/>
    </div>
    <div class="mb-4">
      <label class="form-label small fw-bold text-muted">Mot de passe</label>
      <input type="password" name="password" class="form-control" placeholder="••••••••" required/>
    </div>
    <button type="submit" class="btn btn-primary">Se connecter →</button>
  </form>
  <div class="text-center mt-3">
    <small class="text-muted">Pas encore de compte ? <a href="{{ url_for('register') }}" class="text-primary fw-bold">S'inscrire gratuitement</a></small>
  </div>
</div>
</body>
</html>
